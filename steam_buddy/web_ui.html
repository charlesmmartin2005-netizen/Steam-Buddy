<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steam Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #0F1113; --rail: #0B0C0E; --surface: #181B1F; --surface2: #22262B; --line: #1F2327; --line2: #2C3137;
  --text: #F2F4F5; --muted: #A3ABB3; --faint: #8B939B; --accent: #4CC94C; --on-accent: #0B1A0B; --ring-off: #3A4047;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, "Segoe UI", sans-serif; }
a { color: var(--text); text-decoration: none; }
a:hover { color: #fff; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
.app { display: flex; min-height: 100vh; }

/* rail (desktop) and tab bar (phone) */
.rail { width: 88px; flex-shrink: 0; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 0; position: sticky; top: 0; height: 100vh; }
.logo { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.nav { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
.nav svg { stroke: var(--muted); }
.nav[aria-current="page"] { background: var(--surface2); }
.nav[aria-current="page"] svg { stroke: var(--accent); }
.tabs { display: none; }

main { flex: 1; min-width: 0; padding: 36px 40px 40px 48px; }
.view { display: none; }
.view.on { display: block; }

/* home */
.home { display: flex; gap: 40px; align-items: flex-start; }
.home-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 26px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 4px 0 0; font-size: 32px; font-weight: 800; letter-spacing: -.02em; }
h2 { margin: 0; font-size: 18px; font-weight: 700; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.pill-btn { height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid var(--line2); background: var(--surface); display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
.pill-btn:hover { background: var(--surface2); }

.stories { display: flex; gap: 24px; overflow-x: auto; padding: 4px 2px 6px; }
.story { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 84px; flex-shrink: 0; }
.ring { width: 76px; height: 76px; border-radius: 50%; padding: 3px; border: 3px solid var(--ring-off); }
.ring.new { border-color: var(--accent); }
.ring > * { width: 100%; height: 100%; border-radius: 50%; }
.story-name { font-size: 12px; font-weight: 600; text-align: center; line-height: 1.3; }
.story-name.dim { color: var(--muted); font-weight: 500; }
.legend { align-self: center; font-size: 13px; color: var(--muted); max-width: 190px; line-height: 1.45; }

.hero { position: relative; min-height: 250px; border-radius: 20px; overflow: hidden; background: var(--surface); }
.hero > .art { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,12,14,.95) 0%, rgba(11,12,14,.8) 45%, rgba(11,12,14,.1) 80%); }
.hero-body { position: relative; z-index: 1; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; max-width: 560px; min-height: 250px; justify-content: space-between; }
.hero h3 { margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -.02em; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.meta { font-size: 14px; color: #C9CFD4; line-height: 1.5; }
.btns { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { height: 44px; padding: 0 22px; border-radius: 22px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; border: 0; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { color: var(--on-accent); filter: brightness(1.08); }
.btn.glass { background: rgba(255,255,255,.14); color: #fff; font-weight: 600; }
.btn.ghost { background: var(--surface); border: 1px solid var(--line2); font-weight: 600; }

.shelves { display: flex; gap: 32px; flex-wrap: wrap; }
.shelf { display: flex; flex-direction: column; gap: 12px; }
.tiles { display: flex; gap: 16px; flex-wrap: wrap; }
.tile { width: 156px; display: flex; flex-direction: column; gap: 8px; }
.tile .art { width: 156px; height: 210px; border-radius: 14px; transition: outline-color .1s; outline: 3px solid transparent; outline-offset: 3px; }
.tile:hover .art, .tile:focus-visible .art { outline-color: var(--accent); }
.tile:focus-visible { outline: none; }
.t-name { font-size: 14px; font-weight: 700; }
.t-sub { font-size: 12px; color: var(--muted); }

.aside { width: 320px; flex-shrink: 0; padding: 24px; border-radius: 20px; background: var(--surface); display: flex; flex-direction: column; gap: 20px; position: sticky; top: 36px; }
.act { display: flex; gap: 12px; font-size: 13px; line-height: 1.45; }
.act .art { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
.act .when { color: var(--faint); font-size: 12px; }
.muted { color: var(--muted); }
.box { padding: 16px; border-radius: 14px; background: var(--surface2); display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.45; }

/* art + placeholder */
.art { display: block; object-fit: cover; background: var(--surface2); }
.ph { display: flex; align-items: center; justify-content: center; background: var(--surface2); color: var(--muted); font-weight: 800; font-size: 18px; letter-spacing: .02em; }

/* feed */
.feed { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.post { background: var(--surface); border-radius: 18px; overflow: hidden; }
.post-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
.post-head .art { width: 36px; height: 36px; border-radius: 50%; }
.post-head .who { flex: 1; display: flex; flex-direction: column; gap: 1px; }
.post-head .who b { font-size: 14px; }
.post-head .who span { font-size: 12px; color: var(--muted); }
.chip { height: 26px; padding: 0 10px; border-radius: 13px; background: #1E2A1E; color: var(--accent); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; white-space: nowrap; }
.chip.grey { background: var(--surface2); color: var(--text); }
.post-img { width: 100%; aspect-ratio: 460 / 215; }
.post-actions { display: flex; align-items: center; padding: 8px 8px 0; gap: 4px; }
.post-actions .sp { flex: 1; }
.post-body { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.55; }
.icon-btn { width: 44px; height: 44px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 12px; }
.icon-btn:hover { background: var(--surface2); }
.small-btn { height: 36px; padding: 0 14px; border-radius: 18px; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; margin-right: 8px; }
.small-btn:hover { color: var(--on-accent); }

/* pick card */
.pick { max-width: 460px; margin: 0 auto; background: var(--surface); border-radius: 24px; overflow: hidden; }
.pick-hero { position: relative; height: 300px; }
.pick-hero .art { position: absolute; inset: 0; width: 100%; height: 100%; }
.pick-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(24,27,31,.2) 0%, rgba(24,27,31,0) 35%, rgba(24,27,31,.92) 85%, var(--surface) 100%); }
.pick-hero .over { position: absolute; z-index: 1; left: 20px; right: 20px; bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
.pick-hero .badge { position: absolute; z-index: 1; top: 14px; right: 14px; }
.pick h3 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; }
.tag { height: 28px; padding: 0 12px; border-radius: 14px; background: var(--surface2); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; }
.pick-body { padding: 16px 20px 22px; display: flex; flex-direction: column; gap: 20px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { padding: 12px; border-radius: 14px; background: var(--surface2); display: flex; flex-direction: column; gap: 4px; }
.stat b { font-size: 22px; font-weight: 800; }
.stat span { font-size: 11px; color: var(--muted); }
.because { display: flex; flex-direction: column; gap: 10px; }
.because-row { display: flex; align-items: center; gap: 12px; }
.because-row .ph { width: 44px; height: 44px; border-radius: 10px; font-size: 14px; }
.because-row .thumb { width: 44px; height: 66px; border-radius: 8px; flex-shrink: 0; }
.warn { font-size: 13px; color: #F5C46B; line-height: 1.45; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 460px; margin: 16px auto 0; }
.dots { display: flex; gap: 6px; }
.dot { width: 6px; height: 6px; border-radius: 3px; background: var(--ring-off); }
.dot.on { width: 18px; background: var(--accent); }

/* chat */
.chat { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-height: calc(100vh - 80px); }
.msgs { flex: 1; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 85%; padding: 14px 16px; border-radius: 18px; font-size: 14px; line-height: 1.6; }
.msg p { margin: 0 0 8px; } .msg p:last-child { margin: 0; }
.msg ul { margin: 0 0 8px; padding-left: 20px; }
.msg.you { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 6px; }
.msg.buddy { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 6px; }
.msg .used { font-size: 12px; color: var(--faint); margin-bottom: 8px; }
.suggest { display: flex; gap: 8px; flex-wrap: wrap; }
.composer { position: sticky; bottom: 16px; display: flex; gap: 10px; background: var(--bg); padding-top: 8px; }
.composer label { position: absolute; left: -9999px; }
.composer input { flex: 1; height: 50px; border-radius: 25px; border: 1px solid var(--line2); background: var(--surface); color: var(--text); padding: 0 20px; font: inherit; font-size: 15px; }
.composer input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

.state { padding: 60px 20px; text-align: center; color: var(--muted); line-height: 1.6; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line2); border-top-color: var(--accent); margin: 0 auto 16px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

@media (max-width: 1100px) {
  .home { flex-direction: column; }
  .aside { width: 100%; position: static; }
}
@media (max-width: 760px) {
  .rail { display: none; }
  main { padding: 16px 16px 96px; }
  .tabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; height: 72px; background: var(--rail); border-top: 1px solid var(--line); justify-content: space-around; align-items: center; z-index: 5; }
  h1 { font-size: 26px; }
  .legend { display: none; }
  .ring { width: 66px; height: 66px; }
  .story { width: 70px; }
  .hero h3 { font-size: 28px; }
  .hero-body { padding: 22px; }
  .tile { width: calc(50% - 8px); }
  .tile .art { width: 100%; height: auto; aspect-ratio: 2 / 3; }
  .feed .post { border-radius: 14px; }
  .msg { max-width: 92%; }
  .composer { bottom: 84px; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="logo" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B1A0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"></rect><path d="M7 11v3M5.5 12.5h3"></path><circle cx="16" cy="11.5" r="1"></circle><circle cx="18" cy="13.5" r="1"></circle></svg>
    </div>
    <a class="nav" href="#home" data-view="home" aria-label="Home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></a>
    <a class="nav" href="#feed" data-view="feed" aria-label="News feed"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M7 8h10M7 12h10M7 16h6"></path></svg></a>
    <a class="nav" href="#picks" data-view="picks" aria-label="Picks for you"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></a>
    <a class="nav" href="#chat" data-view="chat" aria-label="Chat with Steam Buddy"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></a>
  </nav>

  <main>
    <section class="view" id="view-home" aria-label="Home"></section>
    <section class="view" id="view-feed" aria-label="News feed"></section>
    <section class="view" id="view-picks" aria-label="Picks for you"></section>
    <section class="view" id="view-chat" aria-label="Chat">
      <div class="chat">
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <form class="composer" id="composer">
          <label for="q">Ask Steam Buddy</label>
          <input id="q" name="q" autocomplete="off" placeholder="Ask about your games…" maxlength="2000">
          <button class="btn primary" type="submit">Send</button>
        </form>
      </div>
    </section>
  </main>

  <nav class="tabs" aria-label="Tabs">
    <a class="nav" href="#home" data-view="home" aria-label="Home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></a>
    <a class="nav" href="#feed" data-view="feed" aria-label="News feed"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M7 8h10M7 12h10M7 16h6"></path></svg></a>
    <a class="nav" href="#picks" data-view="picks" aria-label="Picks for you"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></a>
    <a class="nav" href="#chat" data-view="chat" aria-label="Chat with Steam Buddy"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></a>
  </nav>
</div>

<script>
"use strict";
const TOKEN = "__BUDDY_TOKEN__";
let DATA = null;

// -- helpers: every piece of text goes in as a text node, never as HTML ------------------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
function svg(path, size = 20, stroke = "currentColor") {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("width", size); s.setAttribute("height", size); s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("fill", "none"); s.setAttribute("stroke", stroke); s.setAttribute("stroke-width", "2");
  s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round"); s.setAttribute("aria-hidden", "true");
  s.innerHTML = path;  // fixed icon paths below, never data
  return s;
}
const ICON = {
  play: '<path d="M7 4l13 8-13 8z" fill="currentColor" stroke="none"></path>',
  chat: '<path d="M4 5h16v11H9l-5 4z"></path>',
  link: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path>',
  search: '<circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>',
  left: '<path d="M15 5l-7 7 7 7"></path>', right: '<path d="M9 5l7 7-7 7"></path>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path>',
};
function initials(name) {
  return (name || "?").split(/[\s:\-]+/).filter(w => /[A-Za-z0-9]/.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join("");
}
// An image that tries each URL in turn, then becomes a plain tile with the game's initials.
function art(urls, name, cls, alt = "") {
  const list = urls.filter(Boolean);
  const img = h("img", { class: "art " + (cls || ""), alt, loading: "lazy", referrerpolicy: "no-referrer" });
  let i = 0;
  const next = () => {
    if (i < list.length) { img.src = list[i++]; return; }
    const ph = h("div", { class: "art ph " + (cls || ""), role: alt ? "img" : null, "aria-label": alt || null, "aria-hidden": alt ? null : "true" }, initials(name));
    img.replaceWith(ph);
  };
  img.addEventListener("error", next);
  next();
  return img;
}
const capsule = g => [g.art && g.art.capsule, g.art && g.art.header];
const header = g => [g.art && g.art.header, g.art && g.art.capsule];
const heroArt = g => [g.art && g.art.hero, g.art && g.art.header];
function shortDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function hours(x) { return (Math.round(x * 10) / 10).toLocaleString("en-US") + "h"; }
function money(g) {
  if (!g.price) return "";
  return g.discount_percent ? `${g.price} (−${g.discount_percent}%)` : g.price;
}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-Buddy-Token": TOKEN, ...(opts.headers || {}) } });
  const data = await r.json().catch(() => ({ error: "The server sent something unreadable." }));
  if (!r.ok) throw new Error(data.error || `Error ${r.status}`);
  return data;
}
function stateBox(spin, ...lines) {
  return h("div", { class: "state" }, spin ? h("div", { class: "spinner", "aria-hidden": "true" }) : null, ...lines.map(l => h("div", {}, l)));
}

// -- home ------------------------------------------------------------------------------------
function renderHome() {
  const root = document.getElementById("view-home");
  const d = DATA;
  const day = new Date(d.day + "T00:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });

  const stories = h("div", { class: "stories", role: "list", "aria-label": "Playing now" },
    d.playing.map(g => h("a", { class: "story", href: "#feed", role: "listitem", title: `${g.name}: ${hours(g.hours_2_weeks)} in the last two weeks` },
      h("div", { class: "ring" + (g.has_news ? " new" : "") }, art(capsule(g).concat(header(g)), g.name, "", g.name)),
      h("div", { class: "story-name" + (g.has_news ? "" : " dim") }, g.name))),
    d.playing.length ? h("div", { class: "legend" }, "Green ring = news from the developer in the last two weeks") :
      h("div", { class: "legend" }, "Nothing played in the last two weeks."));

  let hero = null;
  const r = d.revisit, b = d.backlog;
  if (r) {
    const latest = r.updates[0];
    const n = r.updates.length + (r.more_updates ? "+" : "");
    hero = h("section", { class: "hero", "aria-label": "Worth going back to" },
      art(heroArt(r), r.name),
      h("div", { class: "hero-body" },
        h("div", { style: "display:flex;flex-direction:column;gap:8px" },
          h("div", { class: "kicker" }, "Worth going back to"),
          h("h3", {}, r.name),
          h("div", { class: "meta" }, `${hours(r.hours)} played · last played ${r.last_played_days_ago} days ago` +
            (r.updates.length ? ` · ${n} updates since you stopped` : "")),
          latest ? h("div", { style: "font-size:15px;font-weight:600" }, (latest.big_update ? "New: " : "") + latest.title,
            h("span", { class: "muted", style: "font-weight:400" }, ` · ${shortDate(latest.date)}`)) : null),
        h("div", { class: "btns" },
          latest ? h("a", { class: "btn primary", href: latest.url, target: "_blank", rel: "noopener" }, "See what's new") : null,
          h("a", { class: "btn glass", href: r.play_url }, svg(ICON.play, 14), "Play on Steam"))));
  } else if (b) {
    hero = h("section", { class: "hero", "aria-label": "From your backlog" },
      art(heroArt(b), b.name),
      h("div", { class: "hero-body" },
        h("div", { style: "display:flex;flex-direction:column;gap:8px" },
          h("div", { class: "kicker" }, "From your backlog"),
          h("h3", {}, b.name),
          h("div", { class: "meta" }, b.hours ? `${hours(b.hours)} played` : "You own it but haven't played it yet")),
        h("div", { class: "btns" }, h("a", { class: "btn primary", href: b.play_url }, svg(ICON.play, 14), "Play on Steam"))));
  }

  const tile = (g, i, kind) => h("a", { class: "tile", href: `#picks/${kind === "gem" ? d.picks.length + i : i}` },
    art(capsule(g), g.name, "", g.name),
    h("div", { style: "display:flex;flex-direction:column;gap:2px" },
      h("div", { class: "t-name" }, g.name),
      h("div", { class: "t-sub" }, [money(g), `${Math.round(g.positive_pct)}% of ${g.reviews.toLocaleString("en-US")}`, g.early_access ? "Early Access" : ""].filter(Boolean).join(" · "))));
  const shelves = h("div", { class: "shelves" },
    h("section", { class: "shelf", "aria-label": "Top picks for you" }, h("h2", {}, "Top picks for you"),
      d.picks.length ? h("div", { class: "tiles" }, d.picks.map((g, i) => tile(g, i, "pick"))) : h("div", { class: "muted" }, "No picks right now.")),
    h("section", { class: "shelf", "aria-label": "Hidden gems" }, h("h2", {}, "Hidden gems"),
      d.gems.length ? h("div", { class: "tiles" }, d.gems.map((g, i) => tile(g, i, "gem"))) : h("div", { class: "muted" }, "No hidden gems right now.")));

  const acts = [];
  for (const g of d.playing) for (const p of g.posts.slice(0, 1))
    acts.push({ name: g.name, art: g.art, text: p.title, date: p.date, kind: p.official ? "developer update" : "press", url: p.url });
  if (r) for (const p of r.updates.slice(0, 2))
    acts.push({ name: r.name, art: r.art, text: p.title, date: p.date, kind: "since you stopped", url: p.url });
  acts.sort((a, b) => b.date.localeCompare(a.date));
  const wl = d.wishlist;
  const onSale = wl.filter(w => w.on_sale);
  const aside = h("aside", { class: "aside", "aria-label": "Activity" },
    h("div", { style: "display:flex;align-items:center;justify-content:space-between" }, h("h2", {}, "Activity"),
      h("button", { class: "icon-btn", type: "button", "aria-label": "Refresh", title: "Refresh from Steam", onclick: () => load(true) }, svg(ICON.refresh, 18))),
    acts.length ? acts.slice(0, 5).map(a => h("a", { class: "act", href: a.url, target: "_blank", rel: "noopener" },
      art(capsule(a).concat(header(a)), a.name),
      h("div", { style: "display:flex;flex-direction:column;gap:3px" },
        h("div", {}, h("strong", {}, a.name), " · ", a.text),
        h("div", { class: "when" }, `${shortDate(a.date)} · ${a.kind}`)))) : h("div", { class: "muted", style: "font-size:13px" }, "No news this week."),
    h("div", { class: "box" }, h("div", { style: "font-weight:700" }, "Wishlist"),
      h("div", { class: "muted" }, !wl.length ? "Your wishlist is empty, or Steam didn't share it." :
        onSale.length ? `On sale: ${onSale.map(w => `${w.name} ${w.price} (−${w.discount_percent}%)`).join(" · ")}` :
        `Nothing on sale right now. ${wl.slice(0, 3).map(w => `${w.name} ${w.price || ""}`.trim()).join(" · ")}`)));

  root.replaceChildren(h("div", { class: "home" },
    h("div", { class: "home-main" },
      h("div", { class: "top" },
        h("div", {}, h("div", { class: "eyebrow" }, day), h("h1", {}, "Your week in games")),
        h("a", { class: "pill-btn", href: "#chat" }, svg(ICON.search, 18, "#A3ABB3"), "Ask Steam Buddy")),
      stories, hero, shelves),
    aside));
}

// -- feed ------------------------------------------------------------------------------------
function renderFeed() {
  const root = document.getElementById("view-feed");
  const posts = [];
  for (const g of DATA.playing) for (const p of g.posts) posts.push({ g, p, chip: `${hours(g.hours_2_weeks)} this fortnight` });
  const r = DATA.revisit;
  if (r) for (const p of r.updates.slice(0, 3)) posts.push({ g: r, p, chip: "since you stopped", grey: true });
  posts.sort((a, b) => b.p.date.localeCompare(a.p.date));
  if (!posts.length) { root.replaceChildren(stateBox(false, "No news from the games you're playing in the last two weeks.")); return; }
  root.replaceChildren(h("div", { class: "feed" }, posts.map(({ g, p, chip, grey }) => h("article", { class: "post" },
    h("div", { class: "post-head" },
      art(capsule(g).concat(header(g)), g.name),
      h("div", { class: "who" }, h("b", {}, g.name), h("span", {}, `${p.official ? "Developer update" : "Press"} · ${shortDate(p.date)}`)),
      h("span", { class: "chip" + (grey ? " grey" : "") }, chip)),
    art(header(g), g.name, "post-img", `${g.name} art`),
    h("div", { class: "post-actions" },
      h("a", { class: "icon-btn", href: "#chat", "aria-label": `Ask Steam Buddy about ${g.name}`,
        onclick: () => setTimeout(() => ask(`What's new in ${g.name}?`), 0) }, svg(ICON.chat, 22)),
      h("a", { class: "icon-btn", href: p.url, target: "_blank", rel: "noopener", "aria-label": "Open the full post" }, svg(ICON.link, 22)),
      h("div", { class: "sp" }),
      h("a", { class: "small-btn", href: g.play_url || `steam://run/${g.appid}` }, "Play")),
    h("div", { class: "post-body" },
      h("div", {}, h("strong", {}, p.title), p.summary ? " " + p.summary : ""),
      h("a", { href: p.url, target: "_blank", rel: "noopener", class: "muted", style: "font-size:13px" }, "Read the full post"))))));
}

// -- picks -----------------------------------------------------------------------------------
function renderPicks(index) {
  const root = document.getElementById("view-picks");
  const all = DATA.picks.map(g => ({ g, label: "Top pick" })).concat(DATA.gems.map(g => ({ g, label: "Hidden gem" })));
  if (!all.length) { root.replaceChildren(stateBox(false, "No picks right now.")); return; }
  const i = Math.min(Math.max(index || 0, 0), all.length - 1);
  const { g, label } = all[i];
  const tags = (g.fits_your_tags && g.fits_your_tags.length ? g.fits_your_tags : g.tags || []).slice(0, 4);
  const go = n => { location.hash = `#picks/${(n + all.length) % all.length}`; };
  root.replaceChildren(
    h("article", { class: "pick" },
      h("div", { class: "pick-hero" },
        art(heroArt(g).concat(capsule(g)), g.name, "", `${g.name} art`),
        h("span", { class: "chip grey badge" }, `${label} · ${i + 1} of ${all.length}`),
        h("div", { class: "over" }, h("h3", {}, g.name), h("div", { class: "tags" }, tags.map(t => h("span", { class: "tag" }, t))))),
      h("div", { class: "pick-body" },
        h("div", { class: "stats" },
          h("div", { class: "stat" }, h("b", { style: "color:var(--accent)" }, String(Math.round(g.match))), h("span", {}, "match score")),
          h("div", { class: "stat" }, h("b", {}, `${Math.round(g.positive_pct)}%`), h("span", {}, `of ${g.reviews.toLocaleString("en-US")} reviews`)),
          h("div", { class: "stat" }, h("b", {}, g.price || "—"), h("span", {}, g.discount_percent ? `${g.discount_percent}% off` : (g.early_access ? "Early Access" : "not on sale")))),
        (g.because_you_played || []).length ? h("section", { class: "because", "aria-label": "Because you played" },
          h("h2", { style: "font-size:16px" }, "Because you played"),
          g.because_you_played.map(b => h("div", { class: "because-row" },
            b.art ? art(capsule(b).concat(header(b)), b.game, "thumb") : h("div", { class: "ph", "aria-hidden": "true" }, initials(b.game)),
            h("div", { style: "display:flex;flex-direction:column;gap:2px" },
              h("div", { style: "font-size:14px;font-weight:700" }, b.game, h("span", { class: "muted", style: "font-weight:500" }, ` · ${hours(b.hours)}`)),
              h("div", { class: "muted", style: "font-size:12px" }, (b.shared_tags || []).join(", ")))))) : null,
        g.session_style && g.session_style !== "either" ? h("div", { class: "muted", style: "font-size:13px" }, `Suits ${g.session_style}.`) : null,
        (g.tags_you_tend_to_drop || []).length ? h("div", { class: "warn" }, `Heads-up: you tend to drop ${g.tags_you_tend_to_drop.join(", ")} games.`) : null,
        h("div", { style: "display:flex;flex-direction:column;gap:10px" },
          h("a", { class: "btn primary", href: g.store_url, target: "_blank", rel: "noopener", style: "justify-content:center;height:50px;font-size:15px" }, "View on Steam"),
          h("div", { style: "display:flex;gap:10px" },
            h("button", { class: "btn ghost", type: "button", style: "flex:1;justify-content:center", onclick: () => go(i + 1) }, "Not for me"),
            h("a", { class: "btn ghost", href: "#chat", style: "flex:1;justify-content:center",
              onclick: () => setTimeout(() => ask(`Tell me more about ${g.name}. Would I like it?`), 0) }, svg(ICON.chat, 16), "Ask about it"))))),
    h("div", { class: "pager" },
      h("button", { class: "icon-btn", type: "button", "aria-label": "Previous pick", onclick: () => go(i - 1) }, svg(ICON.left, 22)),
      h("div", { class: "dots", "aria-hidden": "true" }, all.map((_, j) => h("div", { class: "dot" + (j === i ? " on" : "") }))),
      h("button", { class: "icon-btn", type: "button", "aria-label": "Next pick", onclick: () => go(i + 1) }, svg(ICON.right, 22))));
}

// -- chat ------------------------------------------------------------------------------------
// Claude's replies are plain text with light Markdown; turn paragraphs, "- " lists and **bold** into nodes.
function richText(text) {
  const out = [];
  const inline = line => line.split(/(\*\*[^*]+\*\*)/g).filter(Boolean).map(part =>
    part.startsWith("**") && part.endsWith("**") ? h("strong", {}, part.slice(2, -2)) : part);
  for (const block of text.split(/\n{2,}/)) {
    const lines = block.split("\n");
    if (lines.every(l => /^\s*[-•*]\s+/.test(l))) out.push(h("ul", {}, lines.map(l => h("li", {}, inline(l.replace(/^\s*[-•*]\s+/, ""))))));
    else out.push(h("p", {}, lines.flatMap((l, k) => k ? [h("br"), ...inline(l)] : inline(l))));
  }
  return out;
}
const msgs = () => document.getElementById("msgs");
function addMsg(who, text, used) {
  const m = h("div", { class: "msg " + who }, used && used.length ? h("div", { class: "used" }, "· " + used.join(" · ")) : null,
    who === "buddy" ? richText(text) : text);
  msgs().append(m);
  m.scrollIntoView({ block: "end", behavior: "smooth" });
  return m;
}
function chatIntro() {
  if (msgs().childElementCount) return;
  const ideas = ["What should I play tonight?", "What's new in the games I've been playing?",
    "What have I abandoned that's worth going back to?", "What should I buy next for under $20?"];
  msgs().append(h("div", { class: "msg buddy" },
    h("p", {}, "Ask anything about your games. I look at your library, playtime, wishlist and the store before answering."),
    h("div", { class: "suggest" }, ideas.map(q => h("button", { class: "tag", type: "button", style: "border:0;cursor:pointer", onclick: () => ask(q) }, q)))));
}
let busy = false;
async function ask(question) {
  question = (question || "").trim();
  if (!question || busy) return;
  if (location.hash !== "#chat") location.hash = "#chat";
  busy = true;
  addMsg("you", question);
  const wait = h("div", { class: "msg buddy" }, h("div", { class: "used" }, "Thinking… (looking things up can take 10–30 seconds)"));
  msgs().append(wait);
  try {
    const r = await api("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    wait.remove();
    addMsg("buddy", r.text || "(no answer)", r.tools);
  } catch (e) {
    wait.remove();
    addMsg("buddy", `Something went wrong: ${e.message}`);
  } finally { busy = false; }
}
document.getElementById("composer").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  const v = q.value; q.value = "";
  ask(v);
});

// -- routing and loading ---------------------------------------------------------------------
function route() {
  const [view, arg] = (location.hash.replace(/^#/, "") || "home").split("/");
  const name = ["home", "feed", "picks", "chat"].includes(view) ? view : "home";
  for (const v of document.querySelectorAll(".view")) v.classList.toggle("on", v.id === "view-" + name);
  for (const a of document.querySelectorAll(".nav[data-view]")) {
    if (a.dataset.view === name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
  if (name === "chat") { chatIntro(); return; }
  if (!DATA) return;
  if (name === "home") renderHome();
  if (name === "feed") renderFeed();
  if (name === "picks") renderPicks(parseInt(arg, 10) || 0);
  window.scrollTo(0, 0);
}
async function load(refresh) {
  const placeholder = stateBox(true, "Building your week…", "The first load can take a minute while your library's tags are fetched.");
  for (const id of ["view-home", "view-feed", "view-picks"]) document.getElementById(id).replaceChildren(placeholder.cloneNode(true));
  try {
    DATA = await api("/api/home" + (refresh ? "?refresh=1" : ""));
  } catch (e) {
    for (const id of ["view-home", "view-feed", "view-picks"])
      document.getElementById(id).replaceChildren(stateBox(false, "Couldn't load your games.", e.message));
    return;
  }
  route();
}
window.addEventListener("hashchange", route);
route();
load(false);
</script>
