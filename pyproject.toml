[project]
name = "steam-buddy"
version = "0.1.0"
description = "A personal Steam gaming agent powered by Claude tool use"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
steam-buddy = "steam_buddy.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["steam_buddy"]

[tool.setuptools.package-data]
steam_buddy = ["web_ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
